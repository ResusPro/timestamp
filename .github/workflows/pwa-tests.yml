name: Timestamp PWA regression tests
on:
  pull_request:
  push:
    branches: [main, handover-confirmation-preview]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run simulated multi-device and handover regression tests
        run: node --test tests/*.test.mjs
